# Runs the unit tests every time code is pushed to GitHub
name: TestJava

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Get the code from the repository
      - uses: actions/checkout@v4

      # Install Java 21
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # Run all the tests (LoginTest and MessageTest)
      - run: mvn test
